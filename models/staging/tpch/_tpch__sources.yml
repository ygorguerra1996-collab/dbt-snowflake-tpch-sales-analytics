version: 2

sources:
  - name: tpch
    description: Base TPC-H (sample data do Snowflake) de uma distribuidora global.
    database: SNOWFLAKE_SAMPLE_DATA
    schema: TPCH_SF1
    tables:
      - name: region
        columns:
          - name: r_regionkey
            data_tests: [unique, not_null]

      - name: nation
        columns:
          - name: n_nationkey
            data_tests: [unique, not_null]

      - name: supplier
        columns:
          - name: s_suppkey
            data_tests: [unique, not_null]

      - name: customer
        columns:
          - name: c_custkey
            data_tests: [unique, not_null]

      - name: part
        columns:
          - name: p_partkey
            data_tests: [unique, not_null]

      - name: orders
        columns:
          - name: o_orderkey
            data_tests: [unique, not_null]

      - name: partsupp
        description: Chave composta (ps_partkey + ps_suppkey).
        data_tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns: [ps_partkey, ps_suppkey]

      - name: lineitem
        description: Chave composta (l_orderkey + l_linenumber).
        data_tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns: [l_orderkey, l_linenumber]